<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Corporativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#15171C;
    --surface-glass: rgba(255,255,255,0.05);
    --accent:#4FD1C5;
    --accent-2:#F2A65A;
    --accent-3:#FF6FA5;
    --text:#F5F5F0;
    --muted:#8B92A0;
    --rail-h: 64px;
    --border-glass: rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  #stage{
    position:absolute; top:0; left:0; right:0; bottom:var(--rail-h);
    overflow:hidden;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    opacity:0;
    transition:opacity 0.9s ease;
    padding:60px;
    text-align:center;
  }
  .slide.active{ opacity:1; z-index:2; }
  .slide.zoom img{ animation:kenburns 10s ease-in-out forwards; }
  @keyframes kenburns{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
  }
  .slide img.fit-cover{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .caption-box{
    position:absolute; left:40px; right:40px; bottom:100px;
    padding:22px 32px;
    background:var(--surface-glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--border-glass);
    border-radius:16px;
  }
  .caption-box .caption{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    text-shadow:0 2px 12px rgba(0,0,0,0.6);
  }

  /* Tipografia cinética: cada palavra entra com leve atraso em cascata.
     Some sozinha se o usuário preferir menos movimento. */
  .kinetic-word{
    display:inline-block;
    opacity:0;
    transform:translateY(0.3em);
  }
  @media (prefers-reduced-motion: no-preference){
    .kinetic-word{
      animation:kineticIn 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    }
  }
  @media (prefers-reduced-motion: reduce){
    .kinetic-word{ opacity:1; transform:none; }
  }
  @keyframes kineticIn{
    to{ opacity:1; transform:translateY(0); }
  }
  .text-slide .title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    line-height:1.05;
    margin:0 0 20px 0;
  }
  .text-slide .body{
    font-family:'Inter',sans-serif;
    font-weight:400;
    color:var(--muted);
    max-width:1100px;
    line-height:1.4;
  }
  .clock-slide{
    background:var(--surface);
  }
  .clock-slide .time{
    font-family:'JetBrains Mono',monospace;
    font-size:min(22vw, 260px);
    font-weight:500;
    letter-spacing:4px;
    color:var(--accent);
    line-height:1;
  }
  .clock-slide .date{
    font-family:'Space Grotesk',sans-serif;
    font-size:42px;
    text-transform:capitalize;
    color:var(--text);
    margin-top:18px;
  }
  .news-slide{
    background:radial-gradient(circle at 15% 20%, rgba(79,209,197,0.08), transparent 60%), var(--surface);
    align-items:flex-start;
    text-align:left;
    justify-content:center;
    padding:80px 100px;
  }
  .news-slide .eyebrow{
    font-family:'JetBrains Mono',monospace;
    color:var(--accent-2);
    letter-spacing:3px;
    font-size:clamp(14px, 1.4vw, 20px);
    margin-bottom:24px;
  }
  .news-slide ul{
    list-style:none; margin:0; padding:0;
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(24px, 3.2vw, 44px);
    line-height:1.5;
  }
  .news-slide li{
    display:flex; align-items:baseline; gap:20px;
    margin-bottom:14px;
  }
  .news-slide li::before{
    content:"—";
    color:var(--accent);
    flex-shrink:0;
  }

  /* Rail inferior: relógio ao vivo + progresso dos slides */
  #rail{
    position:absolute; left:0; right:0; bottom:0; height:var(--rail-h);
    background:var(--surface);
    border-top:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px;
    font-family:'JetBrains Mono',monospace;
    z-index:5;
  }
  #rail-clock{ font-size:22px; color:var(--text); letter-spacing:1px; }
  #rail-dots{ display:flex; gap:10px; }
  #rail-dots span{
    width:10px; height:10px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    transition:background 0.3s;
  }
  #rail-dots span.on{ background:var(--accent); }
  #rail-brand{ font-size:16px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }

  .ad-slide{
    background:var(--surface);
  }
  .ad-slide .ad-box{
    border:1px solid var(--border-glass);
    background:var(--surface-glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:24px;
    padding:70px 90px;
  }
  .ad-slide .ad-badge{
    font-family:'JetBrains Mono',monospace;
    color:var(--accent-2);
    letter-spacing:4px;
    font-size:clamp(14px, 1.4vw, 20px);
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .ad-slide .ad-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(32px, 4.4vw, 64px);
    color:var(--text);
    margin-bottom:18px;
  }
  .ad-slide .ad-contact{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(18px, 2vw, 28px);
    color:var(--accent);
  }

  /* ---- Slide de aniversário: confete flutuante em CSS puro ---- */
  .birthday-slide{
    background:radial-gradient(circle at 50% 0%, rgba(255,111,165,0.18), transparent 55%),
               radial-gradient(circle at 85% 85%, rgba(79,209,197,0.15), transparent 55%),
               var(--surface);
    overflow:hidden;
  }
  .birthday-slide .confetti{
    position:absolute; top:-40px; font-size:32px;
    opacity:0.9;
  }
  @media (prefers-reduced-motion: no-preference){
    .birthday-slide .confetti{ animation:fall linear infinite; }
  }
  @keyframes fall{
    to{ transform:translateY(115vh) rotate(360deg); }
  }
  .birthday-slide .bday-box{
    position:relative; z-index:2;
    border:1px solid var(--border-glass);
    background:var(--surface-glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:28px;
    padding:60px 90px;
  }
  .birthday-slide .bday-emoji{ font-size:clamp(40px,6vw,72px); margin-bottom:14px; }
  .birthday-slide .bday-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(40px,6vw,88px);
    color:var(--accent-3);
    margin-bottom:14px;
  }
  .birthday-slide .bday-message{
    font-family:'Inter',sans-serif;
    color:var(--text);
    font-size:clamp(18px,2.4vw,30px);
    max-width:800px;
  }

  /* ---- Slide de redes sociais ---- */
  .social-slide{ background:var(--surface); }
  .social-slide .social-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(32px,4.5vw,60px);
    color:var(--text);
    margin-bottom:44px;
  }
  .social-slide .social-grid{
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center;
  }
  .social-slide .social-item{
    display:flex; align-items:center; gap:16px;
    border:1px solid var(--border-glass);
    background:var(--surface-glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:18px;
    padding:20px 30px;
  }
  .social-slide .social-icon{ font-size:clamp(28px,3.4vw,44px); }
  .social-slide .social-handle{
    font-family:'JetBrains Mono',monospace;
    color:var(--accent);
    font-size:clamp(16px,2vw,26px);
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="rail">
  <div id="rail-clock">--:--:--</div>
  <div id="rail-dots"></div>
  <div id="rail-brand">Anca Soluções</div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO
   Edite apenas o arquivo config.json no GitHub — este HTML
   não precisa ser tocado no dia a dia.
========================================================= */
const CONFIG_URL = 'config.json';
const CONFIG_POLL_SECONDS = 60;   // de quanto em quanto tempo verifica atualização
const HARD_RELOAD_MINUTES = 120;  // recarrega a página inteira de tempos em tempos (evita travar a TV)

let allSlides = [];
let slides = [];
let currentIndex = 0;
let slideTimer = null;
let stageEl = document.getElementById('stage');
let dotsEl = document.getElementById('rail-dots');

function cacheBust(url){
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 't=' + Date.now();
}

/* Presets de tamanho responsivo: se ajustam sozinhos ao tamanho real da tela
   (celular, monitor, TV pequena ou TV grande) usando clamp(mínimo, ideal, máximo). */
const SIZE_PRESETS = {
  title:   { pequeno:'clamp(32px,5vw,56px)',  medio:'clamp(48px,7vw,84px)',  grande:'clamp(64px,9vw,120px)', enorme:'clamp(80px,11vw,160px)' },
  body:    { pequeno:'clamp(16px,2vw,22px)',  medio:'clamp(20px,2.6vw,30px)', grande:'clamp(26px,3.4vw,40px)', enorme:'clamp(32px,4.2vw,50px)' },
  caption: { pequeno:'clamp(18px,2.4vw,26px)', medio:'clamp(24px,3.2vw,36px)', grande:'clamp(30px,4vw,46px)', enorme:'clamp(38px,5vw,58px)' },
};
function resolveSize(value, kind){
  if(!value) return SIZE_PRESETS[kind].medio;
  if(SIZE_PRESETS[kind][value]) return SIZE_PRESETS[kind][value];
  return value; // valor CSS customizado, ex: "80px" ou "6vw" (compatibilidade com configs antigas)
}

// Quebra um texto em palavras, cada uma como <span> com atraso crescente,
// criando o efeito de "tipografia cinética" (entrada em cascata).
function kineticText(el, text){
  el.innerHTML = '';
  (text || '').split(' ').forEach((word, idx) => {
    const span = document.createElement('span');
    span.className = 'kinetic-word';
    span.style.animationDelay = (idx * 0.08) + 's';
    span.textContent = word;
    el.appendChild(span);
    el.appendChild(document.createTextNode(' '));
  });
}

const SOCIAL_ICONS = {
  instagram:'📷', facebook:'📘', tiktok:'🎵', linkedin:'💼',
  whatsapp:'💬', youtube:'▶️', twitter:'🐦', x:'✕', site:'🌐',
};
function parseSocialItem(raw){
  const idx = (raw || '').indexOf(':');
  if(idx === -1) return { icon:'🔗', handle: raw || '' };
  const key = raw.slice(0, idx).trim().toLowerCase();
  const handle = raw.slice(idx + 1).trim();
  return { icon: SOCIAL_ICONS[key] || '🔗', handle };
}

/* ---------- Agendamento: slide só aparece nas datas/dias configurados ---------- */
function isSlideActive(slide, now){
  if(slide.hidden) return false;
  if(slide.dateStart && now < new Date(slide.dateStart + 'T00:00:00')) return false;
  if(slide.dateEnd && now > new Date(slide.dateEnd + 'T23:59:59')) return false;
  if(slide.annualDate){
    const parts = slide.annualDate.split('-').map(Number);
    const mm = parts[0], dd = parts[1];
    if(mm && dd){
      const target = new Date(now.getFullYear(), mm - 1, dd);
      const windowDays = slide.annualWindowDays || 0;
      const diffDays = Math.abs((now - target) / 86400000);
      if(diffDays > windowDays) return false;
    }
  }
  if(slide.weekdays && slide.weekdays.length && !slide.weekdays.includes(now.getDay())) return false;
  return true;
}

async function loadConfig(){
  try{
    const res = await fetch(cacheBust(CONFIG_URL), {cache:'no-store'});
    const data = await res.json();
    allSlides = data.slides || [];
    if(data.brand) document.getElementById('rail-brand').textContent = data.brand;
    applySchedule();
  }catch(e){
    console.error('Falha ao carregar config.json', e);
  }
}

// Recalcula quais slides estão "no ar" agora, sem precisar buscar o arquivo de novo.
// Roda a cada minuto, então um slide de data específica aparece/some sozinho na hora certa.
function applySchedule(){
  const now = new Date();
  const active = allSlides.filter(s => isSlideActive(s, now));
  const changed = JSON.stringify(active) !== JSON.stringify(slides);
  slides = active;
  if(changed){
    currentIndex = 0;
    renderDots();
  }
}

function renderDots(){
  dotsEl.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('span');
    if(i === currentIndex) d.classList.add('on');
    dotsEl.appendChild(d);
  });
}

function buildSlideEl(slide){
  const el = document.createElement('div');
  el.className = 'slide';

  const bg = slide.background || null;
  if(bg) el.style.background = bg;

  switch(slide.type){
    case 'image': {
      const img = document.createElement('img');
      img.src = cacheBust(slide.src);
      img.className = 'fit-cover';
      el.appendChild(img);
      if(slide.animation === 'zoom') el.classList.add('zoom');
      if(slide.caption){
        const box = document.createElement('div');
        box.className = 'caption-box';
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = slide.caption;
        cap.style.color = slide.captionColor || '#F5F5F0';
        cap.style.fontSize = resolveSize(slide.captionSize, 'caption');
        cap.style.textAlign = slide.captionAlign || 'left';
        box.appendChild(cap);
        el.appendChild(box);
      }
      break;
    }
    case 'text': {
      el.classList.add('text-slide');
      if(slide.title){
        const t = document.createElement('div');
        t.className = 'title';
        t.style.color = slide.color || 'var(--accent)';
        t.style.fontSize = resolveSize(slide.fontSize, 'title');
        el.appendChild(t);
        kineticText(t, slide.title);
      }
      if(slide.body){
        const b = document.createElement('div');
        b.className = 'body';
        b.textContent = slide.body;
        b.style.color = slide.bodyColor || 'var(--muted)';
        b.style.fontSize = resolveSize(slide.bodySize, 'body');
        el.appendChild(b);
      }
      break;
    }
    case 'clock': {
      el.classList.add('clock-slide');
      const time = document.createElement('div');
      time.className = 'time';
      time.id = 'big-clock-time';
      const date = document.createElement('div');
      date.className = 'date';
      date.id = 'big-clock-date';
      el.appendChild(time);
      el.appendChild(date);
      break;
    }
    case 'news': {
      el.classList.add('news-slide');
      const eyebrow = document.createElement('div');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = slide.label || 'ÚLTIMAS NOTÍCIAS';
      const ul = document.createElement('ul');
      (slide.items || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });
      el.appendChild(eyebrow);
      el.appendChild(ul);
      break;
    }
    case 'birthday': {
      el.classList.add('birthday-slide');
      // Confetes flutuantes em CSS puro, sem depender de imagens
      const confettiEmojis = ['🎉','🎈','🎊','✨'];
      for(let c = 0; c < 14; c++){
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.textContent = confettiEmojis[c % confettiEmojis.length];
        conf.style.left = (Math.random() * 100) + '%';
        conf.style.animationDuration = (6 + Math.random() * 6) + 's';
        conf.style.animationDelay = (Math.random() * 6) + 's';
        el.appendChild(conf);
      }
      const box = document.createElement('div');
      box.className = 'bday-box';
      const emoji = document.createElement('div');
      emoji.className = 'bday-emoji';
      emoji.textContent = '🎂';
      const title = document.createElement('div');
      title.className = 'bday-title';
      kineticText(title, slide.title || 'Feliz Aniversário!');
      box.appendChild(emoji);
      box.appendChild(title);
      if(slide.message){
        const msg = document.createElement('div');
        msg.className = 'bday-message';
        msg.textContent = slide.message;
        box.appendChild(msg);
      }
      el.appendChild(box);
      break;
    }
    case 'social': {
      el.classList.add('social-slide');
      const title = document.createElement('div');
      title.className = 'social-title';
      title.textContent = slide.title || 'Siga-nos nas redes sociais';
      const grid = document.createElement('div');
      grid.className = 'social-grid';
      (slide.items || []).forEach(raw => {
        const { icon, handle } = parseSocialItem(raw);
        const item = document.createElement('div');
        item.className = 'social-item';
        item.innerHTML = `<span class="social-icon">${icon}</span><span class="social-handle"></span>`;
        item.querySelector('.social-handle').textContent = handle;
        grid.appendChild(item);
      });
      el.appendChild(title);
      el.appendChild(grid);
      break;
    }
    case 'ad': {
      el.classList.add('ad-slide');
      const box = document.createElement('div');
      box.className = 'ad-box';
      const badge = document.createElement('div');
      badge.className = 'ad-badge';
      badge.textContent = '📣 ' + (slide.subtitle || 'Anuncie aqui');
      const title = document.createElement('div');
      title.className = 'ad-title';
      box.appendChild(badge);
      box.appendChild(title);
      kineticText(title, slide.title || 'Este espaço está disponível');
      if(slide.contact){
        const contact = document.createElement('div');
        contact.className = 'ad-contact';
        contact.textContent = slide.contact;
        box.appendChild(contact);
      }
      el.appendChild(box);
      break;
    }
    default:
      el.textContent = 'Tipo de slide desconhecido: ' + slide.type;
  }
  return el;
}

function updateBigClock(){
  const t = document.getElementById('big-clock-time');
  const d = document.getElementById('big-clock-date');
  if(!t && !d) return;
  const now = new Date();
  if(t) t.textContent = now.toLocaleTimeString('pt-BR');
  if(d) d.textContent = now.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}

function updateRailClock(){
  document.getElementById('rail-clock').textContent = new Date().toLocaleTimeString('pt-BR');
}

function showSlide(index){
  if(slides.length === 0){
    // Nenhum slide ativo agora (ex: tudo fora do período agendado) — tenta de novo em breve
    stageEl.innerHTML = '<div style="color:#8B92A0;display:flex;align-items:center;justify-content:center;height:100%;font-family:Inter,sans-serif;">Nenhum slide ativo no momento</div>';
    clearTimeout(slideTimer);
    slideTimer = setTimeout(() => showSlide(0), 10000);
    return;
  }
  stageEl.innerHTML = '';
  const slide = slides[index % slides.length];
  const el = buildSlideEl(slide);
  stageEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add('active'));
  renderDots();

  if(slide.type === 'clock') updateBigClock();

  clearTimeout(slideTimer);
  const duration = (slide.duration || 8) * 1000;
  slideTimer = setTimeout(() => {
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }, duration);
}

async function init(){
  await loadConfig();
  showSlide(0);
  setInterval(updateRailClock, 1000);
  setInterval(updateBigClock, 1000);
  updateRailClock();

  // Verifica config.json periodicamente (não interrompe o slide atual)
  setInterval(loadConfig, CONFIG_POLL_SECONDS * 1000);

  // Reavalia agendamento (datas/dias) todo minuto, sem precisar buscar o arquivo de novo
  setInterval(applySchedule, 60 * 1000);

  // Recarrega a página inteira de tempos em tempos (memória/estabilidade da TV box)
  setTimeout(() => location.reload(), HARD_RELOAD_MINUTES * 60 * 1000);
}

init();
</script>
</body>
</html>
