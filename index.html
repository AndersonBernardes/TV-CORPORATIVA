<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Corporativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#15171C;
    --surface-2:#1D2027;
    --surface-glass: rgba(255,255,255,0.05);
    --accent:#C0392B;
    --accent-2:#F2A65A;
    --accent-3:#FF6FA5;
    --text:#F5F5F0;
    --muted:#9AA0AB;
    --border-glass: rgba(255,255,255,0.09);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100vw; height:100vh; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
  }

  /* ===== Cabeçalho: logo + relógio ===== */
  #topo{
    height:100px; background:var(--accent);
    display:flex; justify-content:space-between; align-items:center;
    padding:0 50px; box-shadow:0 4px 24px rgba(0,0,0,0.35);
  }
  #logo{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; letter-spacing:0.5px; }
  #relogio{ text-align:right; font-family:'JetBrains Mono',monospace; }
  #hora{ font-size:38px; font-weight:600; line-height:1; }
  #data{ font-size:15px; opacity:0.88; text-transform:capitalize; margin-top:4px; }

  /* ===== Corpo: banner + painel ===== */
  #corpo{ display:flex; height:calc(100vh - 100px - 56px); }

  #banner{ width:70%; position:relative; overflow:hidden; background:#000; }
  #stage{ position:absolute; inset:0; overflow:hidden; }

  #painel{
    width:30%; background:var(--surface); padding:22px;
    overflow-y:auto; display:flex; flex-direction:column; gap:16px;
  }
  #painel::-webkit-scrollbar{ width:6px; }
  #painel::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:3px; }
  .card{
    background:var(--surface-2); border-left:5px solid var(--accent);
    border-radius:10px; padding:16px 18px; flex-shrink:0;
    opacity:0; transform:translateY(10px);
    animation:cardIn 0.6s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .card h2{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    color:var(--accent-2); margin-bottom:10px;
  }
  .card .card-sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); margin:-6px 0 8px; text-transform:uppercase; letter-spacing:1px; }
  .card p{ font-size:14px; line-height:1.5; color:var(--text); }
  .card ul{ list-style:none; }
  .card li{ font-size:13px; line-height:1.6; margin-bottom:4px; color:var(--text); }
  .card li::before{ content:"• "; color:var(--accent-2); }
  .card .card-social-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .card .card-weather-big{ font-size:40px; font-family:'JetBrains Mono',monospace; color:var(--accent-2); }
  .card .card-empty{ color:var(--muted); font-size:13px; }

  /* ===== Rodapé: ticker rolando ===== */
  #rodape{
    height:56px; background:var(--accent);
    display:flex; align-items:center; overflow:hidden; white-space:nowrap;
  }
  #ticker{
    font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:500;
    display:inline-block; padding-left:100%;
    animation:rolarTicker 35s linear infinite;
  }
  @keyframes rolarTicker{ from{ transform:translateX(0); } to{ transform:translateX(-100%); } }

  /* ===================================================================
     A partir daqui: motor de slides do banner (praticamente idêntico ao
     motor de tela cheia anterior, só que contido dentro de #stage/#banner
     em vez de ocupar o viewport inteiro).
  =================================================================== */
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    opacity:0; transform:scale(1.035);
    transition:opacity 1s ease, transform 1.3s cubic-bezier(.2,.8,.2,1);
    padding:40px; text-align:center;
  }
  .slide.active{ opacity:1; transform:scale(1); z-index:2; }
  .slide::before{
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 18% 25%, rgba(192,57,43,0.16), transparent 42%),
      radial-gradient(circle at 82% 75%, rgba(255,111,165,0.10), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(242,166,90,0.08), transparent 45%);
    background-size:180% 180%;
    background-position:0% 0%, 100% 100%, 50% 100%;
    mix-blend-mode:screen;
    animation:ambientDrift 24s ease-in-out infinite alternate;
  }
  @keyframes ambientDrift{
    from{ background-position:0% 0%, 100% 100%, 50% 100%; }
    to{ background-position:60% 40%, 30% 60%, 70% 40%; }
  }
  .slide img.fit-cover{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  /* Animações de imagem */
  .slide.zoom img{ animation:kenburns 10s ease-in-out forwards; }
  @keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.08); } }
  .slide.anim-pan-left img{ animation:panLeft 10s ease-in-out forwards; }
  .slide.anim-pan-right img{ animation:panRight 10s ease-in-out forwards; }
  .slide.anim-fade-scale img{ animation:fadeScaleImg 1.3s ease-out forwards; }
  .slide.anim-blur-focus img{ animation:blurFocusImg 1.5s ease-out forwards; }
  .slide.anim-slide-in img{ animation:slideInImg 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .slide.anim-slide-right img{ animation:slideRightImg 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
  .slide.anim-fade-in img{ animation:fadeInImg 1.2s ease forwards; }
  .slide.anim-zoom-in img{ animation:zoomInImg 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
  .slide.anim-bounce-in img{ animation:bounceInImg 0.9s cubic-bezier(.34,1.56,.64,1) forwards; }
  .slide.anim-scale-in img{ animation:scaleInImg 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
  .slide.anim-parallax img{ animation:parallaxImg 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes panLeft{ from{ transform:scale(1.12) translateX(3%); } to{ transform:scale(1.12) translateX(-3%); } }
  @keyframes panRight{ from{ transform:scale(1.12) translateX(-3%); } to{ transform:scale(1.12) translateX(3%); } }
  @keyframes fadeScaleImg{ from{ opacity:0; transform:scale(1.05); } to{ opacity:1; transform:scale(1); } }
  @keyframes blurFocusImg{ from{ filter:blur(18px); transform:scale(1.03); } to{ filter:blur(0); transform:scale(1); } }
  @keyframes slideInImg{ from{ opacity:0; transform:translateX(4%); } to{ opacity:1; transform:translateX(0); } }
  @keyframes slideRightImg{ from{ opacity:0; transform:translateX(10%); } to{ opacity:1; transform:translateX(0); } }
  @keyframes fadeInImg{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes zoomInImg{ from{ opacity:0; transform:scale(1.3); } to{ opacity:1; transform:scale(1); } }
  @keyframes bounceInImg{ from{ opacity:0; transform:scale(0.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes scaleInImg{ from{ opacity:0; transform:scale(0.3); } to{ opacity:1; transform:scale(1); } }
  @keyframes parallaxImg{ from{ opacity:0; transform:translateY(4%) scale(1.06); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .caption-box{
    position:absolute; left:24px; right:24px; bottom:24px; padding:18px 24px;
    background:var(--surface-glass); backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--border-glass); border-radius:14px;
  }
  .caption-box.caption-parallax{ opacity:0; transform:translateY(26px); animation:parallaxCaption 0.8s cubic-bezier(.2,.8,.2,1) 0.5s forwards; }
  @keyframes parallaxCaption{ to{ opacity:1; transform:translateY(0); } }
  .caption-box .caption{ font-family:'Space Grotesk',sans-serif; font-weight:700; text-shadow:0 2px 12px rgba(0,0,0,0.6); }

  /* Tipografia cinética e outras animações de título */
  .kinetic-word{ display:inline-block; opacity:0; transform:translateY(0.3em); animation:kineticIn 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes kineticIn{ to{ opacity:1; transform:translateY(0); } }
  .title-anim-slideup{ opacity:0; transform:translateY(40px); animation:titleSlideUp 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
  .title-anim-scalepop{ opacity:0; transform:scale(0.7); animation:titleScalePop 0.6s cubic-bezier(.34,1.56,.64,1) forwards; }
  .title-anim-glow{ opacity:0; animation:titleGlowIn 0.6s ease-out forwards, titleGlowPulse 2.6s ease-in-out 0.6s infinite; }
  @keyframes titleSlideUp{ to{ opacity:1; transform:translateY(0); } }
  @keyframes titleScalePop{ to{ opacity:1; transform:scale(1); } }
  @keyframes titleGlowIn{ to{ opacity:1; } }
  @keyframes titleGlowPulse{ 0%,100%{ text-shadow:0 0 10px currentColor; } 50%{ text-shadow:0 0 28px currentColor, 0 0 46px currentColor; } }
  .typewriter-cursor::after{ content:'|'; margin-left:2px; animation:blinkCursor 0.8s steps(2) infinite; }
  @keyframes blinkCursor{ 50%{ opacity:0; } }
  .stagger-item{ opacity:0; transform:translateY(16px); animation:staggerIn 0.55s ease forwards; }
  @keyframes staggerIn{ to{ opacity:1; transform:translateY(0); } }

  /* Slides de texto/anúncio/aniversário dentro do banner */
  .text-slide .title{ font-family:'Space Grotesk',sans-serif; font-weight:700; line-height:1.05; margin-bottom:16px; }
  .text-slide .body{ font-family:'Inter',sans-serif; color:var(--muted); max-width:90%; line-height:1.4; }
  .clock-slide{ background:var(--surface); }
  .clock-slide .time{ font-family:'JetBrains Mono',monospace; font-size:min(16vw,180px); font-weight:500; color:var(--accent-2); line-height:1; }
  .clock-slide .date{ font-family:'Space Grotesk',sans-serif; font-size:28px; text-transform:capitalize; margin-top:14px; }
  .ad-slide .ad-box{
    border:1px solid var(--border-glass); background:var(--surface-glass);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:20px; padding:40px 50px;
  }
  .ad-slide .ad-badge{ font-family:'JetBrains Mono',monospace; color:var(--accent-2); letter-spacing:3px; font-size:14px; text-transform:uppercase; margin-bottom:16px; }
  .ad-slide .ad-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(26px,3.4vw,48px); margin-bottom:14px; }
  .ad-slide .ad-contact{ font-family:'JetBrains Mono',monospace; font-size:clamp(14px,1.6vw,22px); color:var(--accent-2); }
  .birthday-slide{
    background:radial-gradient(circle at 50% 0%, rgba(255,111,165,0.18), transparent 55%),
               radial-gradient(circle at 85% 85%, rgba(192,57,43,0.15), transparent 55%), var(--surface);
    overflow:hidden;
  }
  .birthday-slide .confetti{ position:absolute; top:-40px; font-size:26px; opacity:0.9; animation:fall linear infinite; }
  @keyframes fall{ to{ transform:translateY(115vh) rotate(360deg); } }
  .birthday-slide .bday-box{
    position:relative; z-index:2; border:1px solid var(--border-glass); background:var(--surface-glass);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:22px; padding:36px 50px;
  }
  .birthday-slide .bday-emoji{ font-size:clamp(32px,4.5vw,56px); margin-bottom:10px; }
  .birthday-slide .bday-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px,4vw,56px); color:var(--accent-3); margin-bottom:10px; }
  .birthday-slide .bday-message{ font-family:'Inter',sans-serif; font-size:clamp(15px,1.8vw,22px); max-width:90%; }
  .embed-slide{ padding:0; }
  .embed-slide iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .embed-slide .embed-error{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:16px; text-align:center; padding:40px; }
  .video-slide{ padding:0; background:#000; }
  .video-slide video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }

  /* Barra de progresso dos slides do banner */
  #bannerDots{ position:absolute; left:20px; bottom:16px; display:flex; gap:6px; z-index:5; }
  .rail-dot{ width:9px; height:5px; border-radius:3px; background:rgba(255,255,255,0.2); overflow:hidden; position:relative; transition:width 0.35s ease; }
  .rail-dot.active{ width:34px; }
  .rail-dot-fill{ position:absolute; inset:0; background:var(--accent-2); transform:scaleX(0); transform-origin:left; transition-property:transform; transition-timing-function:linear; }
</style>
</head>
<body>

<div id="topo">
  <div id="logo">Anca Soluções</div>
  <div id="relogio">
    <div id="hora">--:--:--</div>
    <div id="data">--</div>
  </div>
</div>

<div id="corpo">
  <div id="banner">
    <div id="stage"></div>
    <div id="bannerDots"></div>
  </div>
  <div id="painel"></div>
</div>

<div id="rodape">
  <div id="ticker">Carregando...</div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */
const CONFIG_URL = 'config.json';
const CONFIG_POLL_SECONDS = 60;
const HARD_RELOAD_MINUTES = 15;

let allSlides = [];
let bannerSlides = [];
let currentIndex = 0;
let slideTimer = null;
let stageEl = document.getElementById('stage');
let dotsEl = document.getElementById('bannerDots');

function cacheBust(url){
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 't=' + Date.now();
}

/* ---------- Zonas: cada slide mora no banner, no painel, ou no ticker ---------- */
const DEFAULT_ZONE = {
  image:'banner', video:'banner', ad:'banner', birthday:'banner', embed:'banner', text:'banner', clock:'banner',
  news:'painel', social:'painel', menu:'painel', weather:'painel',
  motivation:'ticker', rss:'ticker',
};
function getZone(slide){
  return slide.zone || DEFAULT_ZONE[slide.type] || 'painel';
}

/* Presets de tamanho responsivo */
const SIZE_PRESETS = {
  title:   { pequeno:'clamp(22px,4vw,40px)',  medio:'clamp(30px,5.5vw,60px)',  grande:'clamp(38px,7vw,84px)', enorme:'clamp(46px,8.5vw,110px)' },
  body:    { pequeno:'clamp(14px,1.8vw,18px)', medio:'clamp(16px,2.2vw,24px)', grande:'clamp(20px,2.8vw,30px)', enorme:'clamp(24px,3.4vw,38px)' },
  caption: { pequeno:'clamp(15px,2vw,20px)', medio:'clamp(18px,2.6vw,26px)', grande:'clamp(22px,3.2vw,34px)', enorme:'clamp(28px,4vw,42px)' },
};
function resolveSize(value, kind){
  if(!value) return SIZE_PRESETS[kind].medio;
  if(SIZE_PRESETS[kind][value]) return SIZE_PRESETS[kind][value];
  return value;
}

function kineticText(el, text){
  el.innerHTML = '';
  (text || '').split(' ').forEach((word, idx) => {
    const span = document.createElement('span');
    span.className = 'kinetic-word';
    span.style.animationDelay = (idx * 0.08) + 's';
    span.textContent = word;
    el.appendChild(span);
    el.appendChild(document.createTextNode(' '));
  });
}
function typewriterReveal(el, text){
  el.textContent = '';
  el.classList.add('typewriter-cursor');
  const chars = Array.from(text || '');
  let idx = 0;
  const totalMs = Math.min(3000, Math.max(800, chars.length * 45));
  const step = totalMs / Math.max(1, chars.length);
  const interval = setInterval(() => {
    el.textContent += chars[idx];
    idx++;
    if(idx >= chars.length){
      clearInterval(interval);
      setTimeout(() => el.classList.remove('typewriter-cursor'), 700);
    }
  }, step);
}
function renderTitle(el, text, animType){
  animType = animType || 'kinetic';
  if(animType === 'none'){ el.textContent = text; return; }
  if(animType === 'kinetic'){ kineticText(el, text); return; }
  if(animType === 'typewriter'){ typewriterReveal(el, text); return; }
  el.textContent = text;
  el.classList.add('title-anim-' + animType);
}
function applyStagger(container, baseDelay = 0.08){
  Array.from(container.children).forEach((child, idx) => {
    child.classList.add('stagger-item');
    child.style.animationDelay = (idx * baseDelay) + 's';
  });
}

const SOCIAL_ICONS = { instagram:'📷', facebook:'📘', tiktok:'🎵', linkedin:'💼', whatsapp:'💬', youtube:'▶️', twitter:'🐦', x:'✕', site:'🌐' };
function parseSocialItem(raw){
  const idx = (raw || '').indexOf(':');
  if(idx === -1) return { icon:'🔗', handle: raw || '' };
  const key = raw.slice(0, idx).trim().toLowerCase();
  const handle = raw.slice(idx + 1).trim();
  return { icon: SOCIAL_ICONS[key] || '🔗', handle };
}

/* ---------- fetch com timeout: nunca fica preso "carregando" pra sempre ---------- */
async function fetchWithTimeout(url, ms = 8000){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, { signal: controller.signal });
  } finally {
    clearTimeout(id);
  }
}

/* ---------- Previsão do tempo (Open-Meteo) ---------- */
const WEATHER_CODE_MAP = {
  0:['☀️','Céu limpo'], 1:['🌤️','Poucas nuvens'], 2:['⛅','Parcialmente nublado'], 3:['☁️','Nublado'],
  45:['🌫️','Nevoeiro'], 48:['🌫️','Nevoeiro com geada'],
  51:['🌦️','Garoa fraca'], 53:['🌦️','Garoa'], 55:['🌦️','Garoa forte'],
  61:['🌧️','Chuva fraca'], 63:['🌧️','Chuva'], 65:['🌧️','Chuva forte'],
  71:['🌨️','Neve fraca'], 73:['🌨️','Neve'], 75:['❄️','Neve forte'],
  80:['🌧️','Pancadas de chuva'], 81:['🌧️','Pancadas de chuva'], 82:['⛈️','Pancadas fortes'],
  95:['⛈️','Tempestade'], 96:['⛈️','Tempestade com granizo'], 99:['⛈️','Tempestade forte'],
};
const weatherCache = {};
async function getWeather(lat, lon){
  const key = `${lat},${lon}`;
  const cached = weatherCache[key];
  if(cached && (Date.now() - cached.time) < 15 * 60 * 1000) return cached.data;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
  const res = await fetchWithTimeout(url);
  const data = await res.json();
  weatherCache[key] = { data, time: Date.now() };
  return data;
}

/* ---------- Notícias via RSS (rss2json.com) ---------- */
const rssCache = {};
async function getRssItems(feedUrl){
  const cached = rssCache[feedUrl];
  if(cached && (Date.now() - cached.time) < 10 * 60 * 1000) return cached.items;
  const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
  const res = await fetchWithTimeout(proxyUrl);
  const data = await res.json();
  if(data.status !== 'ok') throw new Error(data.message || 'Feed inválido');
  const items = (data.items || []).map(it => it.title);
  rssCache[feedUrl] = { items, time: Date.now() };
  return items;
}

/* ---------- Frases motivacionais ---------- */
const motivationLastIndex = new Map();
function pickMotivationPhrase(slide, items){
  if(!items || items.length === 0) return { phrase:'', author:'' };
  let idx = Math.floor(Math.random() * items.length);
  if(items.length > 1 && idx === motivationLastIndex.get(slide)){
    idx = (idx + 1) % items.length;
  }
  motivationLastIndex.set(slide, idx);
  const raw = items[idx];
  const [phrase, author] = raw.split('|').map(s => (s || '').trim());
  return { phrase, author };
}

/* ---------- Cardápio: lê o dia certo, com compatibilidade pro formato antigo ---------- */
function getDayMenu(slide, dayKey){
  const raw = (slide.menu && slide.menu[dayKey]) || [];
  if(Array.isArray(raw)) return { items: raw, image: slide.image || '' };
  return { items: raw.items || [], image: raw.image || slide.image || '' };
}

/* ---------- Agendamento: slide só aparece nas datas/dias configurados ---------- */
function isSlideActive(slide, now){
  if(slide.hidden) return false;
  if(slide.dateStart && now < new Date(slide.dateStart + 'T00:00:00')) return false;
  if(slide.dateEnd && now > new Date(slide.dateEnd + 'T23:59:59')) return false;
  if(slide.annualDate){
    const parts = slide.annualDate.split('-').map(Number);
    const mm = parts[0], dd = parts[1];
    if(mm && dd){
      const target = new Date(now.getFullYear(), mm - 1, dd);
      const windowDays = slide.annualWindowDays || 0;
      const diffDays = Math.abs((now - target) / 86400000);
      if(diffDays > windowDays) return false;
    }
  }
  if(slide.weekdays && slide.weekdays.length && !slide.weekdays.includes(now.getDay())) return false;
  if(slide.type === 'menu' && getDayMenu(slide, String(now.getDay())).items.length === 0) return false;
  return true;
}

/* =========================================================
   BANNER: motor de slides em rotação (praticamente igual ao
   antigo motor de tela cheia, só que contido em #stage/#banner)
========================================================= */
function buildSlideEl(slide){
  const el = document.createElement('div');
  el.className = 'slide';
  const bg = slide.background || null;
  if(bg) el.style.background = bg;

  switch(slide.type){
    case 'image': {
      const img = document.createElement('img');
      img.src = cacheBust(slide.src);
      img.className = 'fit-cover';
      el.appendChild(img);
      if(slide.animation === 'zoom') el.classList.add('zoom');
      else if(slide.animation && slide.animation !== 'nenhuma') el.classList.add('anim-' + slide.animation);
      if(slide.caption){
        const box = document.createElement('div');
        box.className = 'caption-box';
        if(slide.animation === 'parallax') box.classList.add('caption-parallax');
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = slide.caption;
        cap.style.color = slide.captionColor || '#F5F5F0';
        cap.style.fontSize = resolveSize(slide.captionSize, 'caption');
        box.appendChild(cap);
        el.appendChild(box);
      }
      break;
    }
    case 'text': {
      el.classList.add('text-slide');
      if(slide.title){
        const t = document.createElement('div');
        t.className = 'title';
        t.style.color = slide.color || 'var(--accent-2)';
        t.style.fontSize = resolveSize(slide.fontSize, 'title');
        el.appendChild(t);
        renderTitle(t, slide.title, slide.titleAnimation);
      }
      if(slide.body){
        const b = document.createElement('div');
        b.className = 'body';
        b.textContent = slide.body;
        b.style.color = slide.bodyColor || 'var(--muted)';
        b.style.fontSize = resolveSize(slide.bodySize, 'body');
        el.appendChild(b);
      }
      break;
    }
    case 'clock': {
      el.classList.add('clock-slide');
      const time = document.createElement('div'); time.className = 'time'; time.id = 'big-clock-time';
      const date = document.createElement('div'); date.className = 'date'; date.id = 'big-clock-date';
      el.appendChild(time); el.appendChild(date);
      break;
    }
    case 'birthday': {
      el.classList.add('birthday-slide');
      const confettiEmojis = ['🎉','🎈','🎊','✨'];
      for(let c = 0; c < 12; c++){
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.textContent = confettiEmojis[c % confettiEmojis.length];
        conf.style.left = (Math.random() * 100) + '%';
        conf.style.animationDuration = (6 + Math.random() * 6) + 's';
        conf.style.animationDelay = (Math.random() * 6) + 's';
        el.appendChild(conf);
      }
      const box = document.createElement('div'); box.className = 'bday-box';
      const emoji = document.createElement('div'); emoji.className = 'bday-emoji'; emoji.textContent = '🎂';
      const title = document.createElement('div'); title.className = 'bday-title';
      box.appendChild(emoji); box.appendChild(title);
      renderTitle(title, slide.title || 'Feliz Aniversário!', slide.titleAnimation);
      if(slide.message){
        const msg = document.createElement('div'); msg.className = 'bday-message'; msg.textContent = slide.message;
        box.appendChild(msg);
      }
      el.appendChild(box);
      break;
    }
    case 'ad': {
      el.classList.add('ad-slide');
      const box = document.createElement('div'); box.className = 'ad-box';
      const badge = document.createElement('div'); badge.className = 'ad-badge'; badge.textContent = '📣 ' + (slide.subtitle || 'Anuncie aqui');
      const title = document.createElement('div'); title.className = 'ad-title';
      box.appendChild(badge); box.appendChild(title);
      renderTitle(title, slide.title || 'Este espaço está disponível', slide.titleAnimation);
      if(slide.contact){
        const contact = document.createElement('div'); contact.className = 'ad-contact'; contact.textContent = slide.contact;
        box.appendChild(contact);
      }
      el.appendChild(box);
      break;
    }
    case 'embed': {
      el.classList.add('embed-slide');
      if(slide.url){
        const iframe = document.createElement('iframe'); iframe.src = slide.url;
        el.appendChild(iframe);
      } else {
        el.innerHTML = '<div class="embed-error">Nenhum link configurado para este slide</div>';
      }
      break;
    }
    case 'video': {
      el.classList.add('video-slide');
      if(slide.src){
        const video = document.createElement('video');
        video.src = cacheBust(slide.src);
        video.autoplay = true;
        video.muted = slide.muted !== false;
        video.loop = !!slide.loop;
        video.playsInline = true;
        el.appendChild(video);
        if(!slide.loop) video.addEventListener('ended', () => goToNextSlide());
        video.play().catch(() => {});
      } else {
        el.innerHTML = '<div class="embed-error">Nenhum vídeo configurado para este slide</div>';
      }
      break;
    }
    default:
      el.textContent = '';
  }
  return el;
}

function updateBigClock(){
  const t = document.getElementById('big-clock-time');
  const d = document.getElementById('big-clock-date');
  if(!t && !d) return;
  const now = new Date();
  if(t) t.textContent = now.toLocaleTimeString('pt-BR');
  if(d) d.textContent = now.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}

function renderDots(){
  dotsEl.innerHTML = '';
  bannerSlides.forEach((s, i) => {
    const dot = document.createElement('span');
    dot.className = 'rail-dot';
    if(i === currentIndex){
      dot.classList.add('active');
      const fill = document.createElement('span'); fill.className = 'rail-dot-fill';
      dot.appendChild(fill);
      const durationSec = s.duration || 8;
      requestAnimationFrame(() => {
        fill.style.transitionDuration = durationSec + 's';
        fill.style.transform = 'scaleX(1)';
      });
    }
    dotsEl.appendChild(dot);
  });
}

function showSlide(index){
  if(bannerSlides.length === 0){
    stageEl.innerHTML = '<div style="color:#8B92A0;display:flex;align-items:center;justify-content:center;height:100%;font-family:Inter,sans-serif;">Nenhum conteúdo no banner agora</div>';
    clearTimeout(slideTimer);
    slideTimer = setTimeout(() => showSlide(0), 10000);
    return;
  }
  const slide = bannerSlides[index % bannerSlides.length];
  const el = buildSlideEl(slide);
  stageEl.appendChild(el);
  Array.from(stageEl.children).forEach(child => { if(child !== el) child.classList.remove('active'); });
  requestAnimationFrame(() => el.classList.add('active'));
  renderDots();
  if(slide.type === 'clock') updateBigClock();
  setTimeout(() => {
    Array.from(stageEl.children).forEach(child => { if(child !== el) child.remove(); });
  }, 1300);
  clearTimeout(slideTimer);
  const duration = (slide.duration || 8) * 1000;
  slideTimer = setTimeout(goToNextSlide, duration);
}
function goToNextSlide(){
  clearTimeout(slideTimer);
  currentIndex = (currentIndex + 1) % bannerSlides.length;
  showSlide(currentIndex);
}

/* =========================================================
   PAINEL LATERAL: cartões compactos, todos visíveis ao mesmo tempo
========================================================= */
function buildCardEl(slide){
  const card = document.createElement('div');
  card.className = 'card';

  if(slide.type === 'news'){
    card.innerHTML = `<h2>${slide.label || 'Avisos'}</h2>`;
    const ul = document.createElement('ul');
    ul.innerHTML = (slide.items || []).map(t => `<li>${t}</li>`).join('') || '<li class="card-empty">Sem avisos no momento</li>';
    card.appendChild(ul);
  } else if(slide.type === 'social'){
    card.innerHTML = `<h2>${slide.title || 'Redes sociais'}</h2>`;
    (slide.items || []).forEach(raw => {
      const { icon, handle } = parseSocialItem(raw);
      const row = document.createElement('div');
      row.className = 'card-social-row';
      row.innerHTML = `<span>${icon}</span><span>${handle}</span>`;
      card.appendChild(row);
    });
  } else if(slide.type === 'menu'){
    const now = new Date();
    const dayNames = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const todayMenu = getDayMenu(slide, String(now.getDay()));
    card.innerHTML = `<h2>${slide.title || 'Cardápio do dia'}</h2><div class="card-sub">${dayNames[now.getDay()]}</div>`;
    const ul = document.createElement('ul');
    ul.innerHTML = todayMenu.items.map(t => `<li>${t}</li>`).join('') || '<li class="card-empty">Sem cardápio para hoje</li>';
    card.appendChild(ul);
  } else if(slide.type === 'weather'){
    card.innerHTML = `<h2>${slide.city || 'Clima'}</h2><div class="card-weather-big">⏳</div>`;
    if(slide.lat && slide.lon){
      getWeather(slide.lat, slide.lon).then(data => {
        const code = data.current?.weather_code;
        const [icon, desc] = WEATHER_CODE_MAP[code] || ['🌡️','—'];
        const temp = Math.round(data.current?.temperature_2m ?? 0);
        card.innerHTML = `<h2>${slide.city || 'Clima'}</h2><div class="card-weather-big">${icon} ${temp}°</div><p>${desc}</p>`;
      }).catch(() => {
        card.innerHTML = `<h2>${slide.city || 'Clima'}</h2><p class="card-empty">Não foi possível carregar o clima</p>`;
      });
    } else {
      card.innerHTML = `<h2>${slide.city || 'Clima'}</h2><p class="card-empty">⚠️ Configure a cidade no painel admin</p>`;
    }
  } else {
    // Tipo não pensado pra painel, mas configurado assim mesmo — mostra algo genérico
    card.innerHTML = `<h2>${slide.title || slide.label || slide.type}</h2>`;
  }
  return card;
}

function refreshPanel(){
  const painelEl = document.getElementById('painel');
  const now = new Date();
  const panelSlides = allSlides.filter(s => getZone(s) === 'painel' && isSlideActive(s, now));
  painelEl.innerHTML = '';
  if(panelSlides.length === 0){
    painelEl.innerHTML = '<p class="card-empty" style="padding:10px;">Nenhum conteúdo configurado para o painel</p>';
    return;
  }
  panelSlides.forEach((slide, idx) => {
    const card = buildCardEl(slide);
    card.style.animationDelay = (idx * 0.12) + 's';
    painelEl.appendChild(card);
  });
}

/* =========================================================
   TICKER: texto rolando no rodapé, juntando frases/notícias
========================================================= */
async function refreshTicker(){
  const now = new Date();
  const tickerSlides = allSlides.filter(s => getZone(s) === 'ticker' && isSlideActive(s, now));
  const tickerEl = document.getElementById('ticker');
  if(tickerSlides.length === 0){
    tickerEl.textContent = 'Bem-vindos!';
    return;
  }
  const parts = [];
  for(const slide of tickerSlides){
    if(slide.type === 'motivation'){
      const { phrase, author } = pickMotivationPhrase(slide, slide.items);
      if(phrase) parts.push(author ? `${phrase} — ${author}` : phrase);
    } else if(slide.type === 'rss'){
      if(slide.feedUrl){
        try{
          const items = await getRssItems(slide.feedUrl);
          const max = slide.maxItems || 5;
          items.slice(0, max).forEach(t => parts.push(t));
        }catch(e){ /* ignora esse feed nesta rodada */ }
      }
    } else if(slide.type === 'news'){
      (slide.items || []).forEach(t => parts.push(t));
    }
  }
  tickerEl.textContent = parts.length > 0 ? parts.join('   •   ') : 'Bem-vindos!';
}

/* =========================================================
   Relógio do cabeçalho
========================================================= */
function updateHeaderClock(){
  const now = new Date();
  document.getElementById('hora').textContent = now.toLocaleTimeString('pt-BR');
  document.getElementById('data').textContent = now.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}

/* =========================================================
   Carregamento da configuração
========================================================= */
async function loadConfig(){
  try{
    const res = await fetch(cacheBust(CONFIG_URL), { cache:'no-store' });
    const data = await res.json();
    allSlides = data.slides || [];
    if(data.brand) document.getElementById('logo').textContent = data.brand;
    if(data.accentColor) document.documentElement.style.setProperty('--accent', data.accentColor);
    applySchedule();
    refreshPanel();
    refreshTicker();
  }catch(e){
    console.error('Falha ao carregar config.json', e);
  }
}

function applySchedule(){
  const now = new Date();
  const active = allSlides.filter(s => getZone(s) === 'banner' && isSlideActive(s, now));
  const changed = JSON.stringify(active) !== JSON.stringify(bannerSlides);
  bannerSlides = active;
  if(changed){
    currentIndex = 0;
    renderDots();
  }
}

async function init(){
  await loadConfig();
  showSlide(0);
  updateHeaderClock();
  setInterval(updateHeaderClock, 1000);
  setInterval(updateBigClock, 1000);
  setInterval(loadConfig, CONFIG_POLL_SECONDS * 1000);
  setInterval(applySchedule, 60 * 1000);
  setInterval(refreshPanel, 5 * 60 * 1000);
  setInterval(refreshTicker, 5 * 60 * 1000);
  setTimeout(() => location.reload(), HARD_RELOAD_MINUTES * 60 * 1000);
}

init();
</script>
